name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate Code & Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate code and run tests
        run: npm run validate

      - name: Build project
        run: npx cf build

      - name: Check deployment dry-run
        run: npx cf deploy --prebuilt --mode production --dry-run
        env:
          CF_SEND_TELEMETRY: "false"
